name: AccessPath

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run demo > /tmp/accesspath-demo.log 2>&1 &
      - uses: ./
        with:
          flow: accesspath.yml
          baseline: .accesspath/baseline.json
          output: accesspath-results
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accesspath-report
          path: accesspath-results
